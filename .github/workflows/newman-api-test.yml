name: Newman API tests

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

jobs:
  products-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout pinned eshop provider
        shell: bash
        run: |
          git clone https://github.com/ttbhanh/eshop-sut.git hw/eshop-sut
          git -C hw/eshop-sut checkout 85af3ba875c88283615e22cb108f13e2fccaf0e9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hw/eshop-sut/backend/package-lock.json
      - name: Install backend dependencies
        working-directory: hw/eshop-sut/backend
        run: npm ci
      - name: Start provider and wait until ready
        shell: bash
        run: |
          cd hw/eshop-sut/backend
          node server.js > backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/products > /dev/null; then exit 0; fi
            sleep 1
          done
          cat backend.log
          exit 1
      - name: Install Newman
        run: npm install --global newman@6
      - name: Run five data-driven iterations
        working-directory: hw/inclass-hw6/23127334_Mini_API_Testing
        run: |
          newman run mini-products.postman_collection.json \
            --environment mini-local.postman_environment.json \
            --iteration-data mini-products.data.json \
            --reporters cli,json \
            --reporter-json-export mini-newman-report.json
      - name: Upload Newman JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-newman-report
          path: hw/inclass-hw6/23127334_Mini_API_Testing/mini-newman-report.json
          if-no-files-found: warn
